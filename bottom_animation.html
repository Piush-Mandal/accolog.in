<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Accolog Bottom Nav-Bar Design</title>
<style>
  html, body{
    margin:0; padding:0;
    width:100%;
    overflow:hidden;
    background:#F5F3FA;
  }
  *{ box-sizing:border-box; }

  /* Very thin bottom strip - fixed px only. This is a DECORATIVE design
     meant to sit at the very bottom of the screen, its bottom edge
     blending straight into the solid system navigation bar colour
     (#5100CB), the same way the status-bar strip blends at the top. */
  .bottom-strip{
    position:relative;
    width:100%;
    height:76px;
    overflow:hidden;
    background:#F5F3FA;
  }

  /* Soft wavy crest rising up from the bottom */
  .bottom-strip svg{
    position:absolute;
    bottom:0;
    left:0;
    width:200%;
    height:100%;
    animation: waveMove 11s linear infinite;
  }
  @keyframes waveMove{
    0%{ transform:translateX(0); }
    100%{ transform:translateX(-50%); }
  }

  /* Small floating accents inside the wave */
  .dot{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.45);
    animation: dotFloat ease-in-out infinite;
  }
  @keyframes dotFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-3px); }
  }

  /* Solid hand-off block - guarantees a perfect, seamless colour match
     into the real system navigation bar sitting directly below this. */
  .navmatch{
    position:absolute;
    left:0; right:0; bottom:0;
    height:26px;
    background:#5100CB;
  }

  /* preview backdrop so the thin strip is visible in context */
  .preview-body{
    height:260px;
    background:linear-gradient(180deg,#EDE7F6,#F5F3FA);
  }
</style>
</head>
<body>

  <div class="preview-body"></div>

  <div class="bottom-strip">
    <svg viewBox="0 0 800 76" preserveAspectRatio="none">
      <path d="M0,40 C100,15 200,55 320,32 C440,10 540,52 660,28
               C740,14 780,28 800,32
               L1600,32 C1720,28 1760,14 1840,28
               C1960,52 2060,10 2180,32
               C2300,55 2400,15 2500,40
               L2500,76 L0,76 Z"
            fill="#5100CB"/>
    </svg>

    <div class="dot" style="width:8px;height:8px;left:18%;bottom:20px;animation-duration:3.5s;"></div>
    <div class="dot" style="width:5px;height:5px;left:44%;bottom:12px;animation-duration:4.2s;animation-delay:.5s;"></div>
    <div class="dot" style="width:7px;height:7px;left:68%;bottom:24px;animation-duration:3.8s;animation-delay:1s;"></div>
    <div class="dot" style="width:4px;height:4px;left:86%;bottom:14px;animation-duration:4.5s;animation-delay:.2s;"></div>

    <div class="navmatch"></div>
  </div>

</body>
</html>
