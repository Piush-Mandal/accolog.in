    height:100vh;
    background:linear-gradient(160deg, #4527A0 0%, #7E57C2 65%, #9575CD 100%);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .splash::before, .splash::after{
    content:'';
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.06);
  }
  .splash::before{ width:260px; height:260px; top:-110px; right:-90px; }
  .splash::after{ width:180px; height:180px; bottom:-70px; left:-60px; background:rgba(255,255,255,.05); }

  .logo-wrap{
    width:118px; height:118px;
    border-radius:30px;
    display:flex; align-items:center; justify-content:center;
    animation: iconPop 900ms cubic-bezier(.34,1.56,.64,1) forwards,
               iconGlow 2.4s ease-in-out 900ms infinite;
    opacity:0;
    transform:scale(.4);
  }
  .logo-wrap img{
    width:100%;
    height:100%;
    border-radius:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
  }
  @keyframes iconPop{
    0%{ opacity:0; transform:scale(.4) rotate(-8deg); }
    60%{ opacity:1; transform:scale(1.08) rotate(2deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes iconGlow{
    0%,100%{ filter:drop-shadow(0 0 0 rgba(255,255,255,0)); }
    50%{ filter:drop-shadow(0 0 18px rgba(255,255,255,.35)); }
  }

  .brand-name{
    margin-top:26px;
    font-family: 'Zen Dots', sans-serif;
    font-size:26px;
    font-weight:400;
    color:#fff;
    letter-spacing:1px;
    opacity:0;
    transform:translateY(10px);
    animation: fadeUp 600ms ease-out 700ms forwards;
  }
  .brand-sub{
    margin-top:10px;
    font-family: 'IBM Plex Serif', serif;
    font-size:12.5px;
    color:rgba(255,255,255,.75);
    letter-spacing:1.5px;
    text-transform:uppercase;
    opacity:0;
    transform:translateY(8px);
    animation: fadeUp 600ms ease-out 950ms forwards;
  }
  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  .underline{
    margin-top:16px;
    width:0;
    height:3px;
    border-radius:3px;
    background:linear-gradient(90deg, #B39DDB, #fff);
    animation: drawLine 700ms ease-out 1150ms forwards;
  }
  @keyframes drawLine{ to{ width:70px; } }

  .bottom-loader{
    position:absolute;
    bottom:60px;
    display:flex;
    gap:8px;
    opacity:0;
    animation: fadeUp 500ms ease-out 1500ms forwards;
  }
  .bottom-loader span{
    width:7px; height:7px; border-radius:50%;
    background:rgba(255,255,255,.85);
    animation:dotBounce 1.1s ease-in-out infinite;
  }
  .bottom-loader span:nth-child(2){ animation-delay:.15s; }
  .bottom-loader span:nth-child(3){ animation-delay:.3s; }
  @keyframes dotBounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-7px); opacity:1; }
  }
</style>
</head>
