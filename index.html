<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Accolog Splash</title>
<style>
  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#4527A0;
  }
  *{ box-sizing:border-box; }

  .splash{
    width:100%;
    height:100vh;
    background:linear-gradient(160deg, #4527A0 0%, #7E57C2 65%, #9575CD 100%);
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .splash::before, .splash::after{
    content:'';
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.06);
  }
  .splash::before{ width:260px; height:260px; top:-110px; right:-90px; }
  .splash::after{ width:180px; height:180px; bottom:-70px; left:-60px; background:rgba(255,255,255,.05); }

  .icon-wrap{
    width:96px; height:96px;
    background:rgba(255,255,255,.14);
    border-radius:26px;
    display:flex; align-items:center; justify-content:center;
    animation: iconPop 900ms cubic-bezier(.34,1.56,.64,1) forwards,
               iconGlow 2.4s ease-in-out 900ms infinite;
    opacity:0;
    transform:scale(.4);
  }
  @keyframes iconPop{
    0%{ opacity:0; transform:scale(.4) rotate(-8deg); }
    60%{ opacity:1; transform:scale(1.08) rotate(2deg); }
    100%{ opacity:1; transform:scale(1) rotate(0deg); }
  }
  @keyframes iconGlow{
    0%,100%{ box-shadow:0 0 0 0 rgba(255,255,255,0); }
    50%{ box-shadow:0 0 26px 6px rgba(255,255,255,.18); }
  }
  .icon-wrap svg{ width:52px; height:52px; }

  .check-path{
    stroke-dasharray: 24;
    stroke-dashoffset: 24;
    animation: drawCheck 500ms ease-out 950ms forwards;
  }
  @keyframes drawCheck{ to{ stroke-dashoffset:0; } }

  .brand-name{
    margin-top:26px;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    font-size:28px;
    font-weight:700;
    color:#fff;
    letter-spacing:.5px;
    opacity:0;
    transform:translateY(10px);
    animation: fadeUp 600ms ease-out 700ms forwards;
  }
  .brand-sub{
    margin-top:6px;
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    font-size:12.5px;
    color:rgba(255,255,255,.75);
    letter-spacing:2px;
    text-transform:uppercase;
    opacity:0;
    transform:translateY(8px);
    animation: fadeUp 600ms ease-out 950ms forwards;
  }
  @keyframes fadeUp{ to{ opacity:1; transform:translateY(0); } }

  .underline{
    margin-top:16px;
    width:0;
    height:3px;
    border-radius:3px;
    background:linear-gradient(90deg, #B39DDB, #fff);
    animation: drawLine 700ms ease-out 1150ms forwards;
  }
  @keyframes drawLine{ to{ width:70px; } }

  .bottom-loader{
    position:absolute;
    bottom:60px;
    display:flex;
    gap:8px;
    opacity:0;
    animation: fadeUp 500ms ease-out 1500ms forwards;
  }
  .bottom-loader span{
    width:7px; height:7px; border-radius:50%;
    background:rgba(255,255,255,.85);
    animation:dotBounce 1.1s ease-in-out infinite;
  }
  .bottom-loader span:nth-child(2){ animation-delay:.15s; }
  .bottom-loader span:nth-child(3){ animation-delay:.3s; }
  @keyframes dotBounce{
    0%,60%,100%{ transform:translateY(0); opacity:.5; }
    30%{ transform:translateY(-7px); opacity:1; }
  }
</style>
</head>
<body>

  <div class="splash">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="4" y="3" width="16" height="18" rx="3" fill="#fff" fill-opacity="0.95"/>
        <rect x="7" y="7.2" width="10" height="1.5" rx="0.75" fill="#7E57C2"/>
        <rect x="7" y="10.6" width="7" height="1.5" rx="0.75" fill="#B39DDB"/>
        <path class="check-path" d="M7 15.3 L9.6 17.8 L15 12.4" stroke="#4527A0" stroke-width="1.9"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </div>
    <div class="brand-name">Accolog</div>
    <div class="brand-sub">Account Log, Simplified</div>
    <div class="underline"></div>
    <div class="bottom-loader"><span></span><span></span><span></span></div>
  </div>

  <script>
    // Total animation runtime ≈ 2.2s. After it finishes, notify Kodular to move to next screen.
    setTimeout(function(){
      if (window.AppInventor) {
        window.AppInventor.setWebViewString("SPLASH_DONE");
      }
    }, 2300);
  </script>

</body>
</html>
