<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Accolog Top Decoration - Status Bar Matched</title>
<style>
  html, body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:transparent;
    overflow:hidden;
  }
  *{ box-sizing:border-box; }

  .stage{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:transparent;
  }

  /* ---- Floating circles near the top, blending into #4527A0 ---- */
  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(1.5px);
  }
  .b1{
    width:180px; height:180px;
    right:-60px; top:-80px;
    background:radial-gradient(circle at 65% 65%, #7E57C2, #4527A0);
    opacity:.9;
    animation: floatA 7s ease-in-out infinite;
  }
  .b2{
    width:120px; height:120px;
    left:-40px; top:-30px;
    background:radial-gradient(circle at 65% 65%, #9575CD, #4527A0);
    opacity:.75;
    animation: floatB 8s ease-in-out infinite;
  }
  .b3{
    width:70px; height:70px;
    right:60px; top:55px;
    background:radial-gradient(circle at 65% 65%, #B39DDB, #7E57C2);
    opacity:.65;
    animation: floatA 6s ease-in-out infinite reverse;
  }
  .b4{
    width:40px; height:40px;
    left:30%; top:20px;
    background:radial-gradient(circle at 65% 65%, #9575CD, #4527A0);
    opacity:.55;
    animation: floatB 5.5s ease-in-out infinite;
  }
  @keyframes floatA{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-12px,10px) scale(1.06); }
  }
  @keyframes floatB{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(10px,12px) scale(1.08); }
  }

  /* ---- Small drifting dots ---- */
  .dot{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.30);
    animation: drift ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{ transform:translate(0,0); opacity:.5; }
    50%{ transform:translate(6px,8px); opacity:1; }
  }

  /* ---- Solid fade strip: blends everything into status bar's solid colour ---- */
  .navmatch{
    position:absolute;
    left:0; right:0; top:0;
    height:110px;
    background:linear-gradient(to top, rgba(69,39,160,0) 0%, rgba(69,39,160,0.55) 45%, #4527A0 85%);
    pointer-events:none;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>

    <div class="dot" style="width:8px;height:8px;left:20%;top:90px;animation-duration:4s;animation-delay:0s;"></div>
    <div class="dot" style="width:5px;height:5px;left:60%;top:120px;animation-duration:5s;animation-delay:1s;"></div>
    <div class="dot" style="width:6px;height:6px;left:78%;top:150px;animation-duration:4.5s;animation-delay:.5s;"></div>
    <div class="dot" style="width:4px;height:4px;left:42%;top:70px;animation-duration:3.5s;animation-delay:1.5s;"></div>

    <div class="navmatch"></div>
  </div>

</body>
</html>
